services:
  - type: web
    name: smartchain-ai-agent
    runtime: python
    rootDir: ai-agent
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 server.app:app
    envVars:
      - key: OG_COMPUTE_PRIVATE_KEY
        sync: false
      - key: OG_COMPUTE_RPC
        value: https://evmrpc-testnet.0g.ai
      - key: OG_COMPUTE_BROKER_URL
        value: https://broker.0g.ai
      - key: OG_COMPUTE_MODEL
        value: llama-3.1-8b-instruct
      - key: FLASK_ENV
        value: production
    plan: free
